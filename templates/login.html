<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In - AetherChat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-container">
    <h1>Log In</h1>
    <form class="auth-form" id="login-form">
      <label>Username <input id="username" required autocomplete="username"></label>
      <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
      <p id="error-message" class="error-message" role="alert"></p>
      <button type="submit" class="nav-button">Log In</button>
    </form>
    <p>New here? You need an administrator-issued <a href="/register">invite</a>.</p>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error-message');
      error.textContent = '';
      const response = await fetch('/auth/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'include',
        body: JSON.stringify({username: username.value, password: password.value}),
      });
      const data = await response.json();
      if (!response.ok) { error.textContent = data.error || 'Login failed'; return; }
      window.location.assign('/');
    });
  </script>
</body>
</html>
