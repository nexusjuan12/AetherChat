<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account - AetherChat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-container">
    <h1>Create Account</h1>
    <p>Accounts are invite-only. Recovery email is collected for administrator-assisted recovery only.</p>
    <form class="auth-form" id="register-form">
      <label>Invite Code <input id="invite" required autocomplete="off"></label>
      <label>Username <input id="username" required autocomplete="username"></label>
      <label>Recovery Email <input id="email" type="email" required autocomplete="email"></label>
      <label>Password <input id="password" type="password" minlength="12" required autocomplete="new-password"></label>
      <p id="error-message" class="error-message" role="alert"></p>
      <button type="submit" class="nav-button">Create Account</button>
    </form>
    <p>Already invited? <a href="/login">Log in</a>.</p>
  </main>
  <script>
    document.getElementById('register-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error-message');
      error.textContent = '';
      const response = await fetch('/auth/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'include',
        body: JSON.stringify({
          invite: document.getElementById('invite').value,
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await response.json();
      if (!response.ok) { error.textContent = data.error || 'Registration failed'; return; }
      window.location.assign('/');
    });
  </script>
</body>
</html>
