<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Character - AetherChat</title>
  <link rel="stylesheet" href="/css/create-character.css">
</head>
<body>
  <main class="container">
    <form id="characterForm" class="character-form">
      <h1>Create Character</h1>
      <section class="form-section">
        <label>Name <input id="name" required maxlength="100"></label>
        <label>Category <input id="category" value="Other" maxlength="50"></label>
        <label>Description <textarea id="description" required></textarea></label>
        <label>System Prompt <textarea id="systemPrompt" required></textarea></label>
        <label>Greetings <textarea id="greetings" placeholder="One greeting per line"></textarea></label>
      </section>
      <section class="form-section">
        <h2>Voice</h2>
        <label>Voice Profile
          <select id="voice-profile"><option value="">Default service voice</option></select>
        </label>
        <label>Speech Rate <input id="tts-rate" type="range" min="-100" max="100" value="0"></label>
        <p>Create private or reviewable public Qwen voice profiles from the character tools after the speech provider has been configured.</p>
      </section>
      <section class="form-section">
        <h2>Media</h2>
        <label>Avatar <input id="avatar" type="file" accept="image/png,image/jpeg,image/gif,image/webp" required></label>
        <label>Background <input id="background" type="file" accept="image/*,video/mp4,video/webm" required></label>
      </section>
      <section class="form-section">
        <label><input id="private" type="checkbox"> Keep this character private</label>
      </section>
      <p id="status" role="status"></p>
      <button class="submit-btn" type="submit">Create Character</button>
    </form>
  </main>
  <script src="/js/characterCreation.js"></script>
</body>
</html>
