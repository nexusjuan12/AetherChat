<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration - AetherChat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="auth-container" style="max-width: 860px">
    <h1>Administration</h1>
    <section>
      <h2>Invite</h2>
      <label>Expires in hours <input id="invite-hours" type="number" min="1" max="720" value="168"></label>
      <button id="create-invite" class="nav-button">Create Invite</button>
      <code id="invite-result"></code>
    </section>
    <section>
      <h2>Deployment Features</h2>
      <label><input id="video" type="checkbox"> Video endpoint enabled</label>
      <label><input id="story" type="checkbox"> Story Mode enabled</label>
      <button id="save-features" class="nav-button">Save Features</button>
    </section>
    <section>
      <h2>Accounts</h2>
      <div id="users">Loading…</div>
    </section>
  </main>
  <script type="module">
    import { apiFetch, checkAuth } from '/auth.js';
    const users = document.getElementById('users');
    async function load() {
      if (!await checkAuth()) { location.assign('/login'); return; }
      const [userResponse, featureResponse] = await Promise.all([apiFetch('/api/admin/users'), apiFetch('/api/admin/features')]);
      const accountRows = await userResponse.json();
      const features = await featureResponse.json();
      document.getElementById('video').checked = features.video;
      document.getElementById('story').checked = features.story;
      users.replaceChildren(...accountRows.map(user => {
        const line = document.createElement('p');
        line.textContent = `${user.username} · ${user.auth_provider} · ${user.is_active ? 'active' : 'disabled'}${user.is_admin ? ' · admin' : ''}`;
        return line;
      }));
    }
    document.getElementById('create-invite').addEventListener('click', async () => {
      const response = await apiFetch('/api/admin/invites', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({expires_in_hours: Number(document.getElementById('invite-hours').value)})});
      const data = await response.json();
      document.getElementById('invite-result').textContent = response.ok ? data.invite : data.error;
    });
    document.getElementById('save-features').addEventListener('click', async () => {
      await apiFetch('/api/admin/features', {method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({video: document.getElementById('video').checked, story: document.getElementById('story').checked})});
    });
    load();
  </script>
</body>
</html>
